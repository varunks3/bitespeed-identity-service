services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=bitespeed
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: your-username/bitespeed-identity-service:latest
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=bitespeed
      - DB_USER=postgres
      - DB_PASSWORD=password
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
